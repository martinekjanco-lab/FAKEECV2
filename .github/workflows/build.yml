name: Build ItemDisguise

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Assemble project from repo files
        run: |
          find . -type f -not -path "./.git/*" | sort
          mkdir -p proj/src/main/java/com/vyn/disguise proj/src/main/resources
          pick() { find . -type f -name "$1" -not -path "./.git/*" -not -path "./proj/*" | head -n 1; }
          need() {
            p=$(pick "$1")
            if [ -z "$p" ]; then echo "ERROR: $1 is missing from the repo"; exit 1; fi
            mkdir -p "$(dirname "$2")"
            cp "$p" "$2"
          }
          need build.gradle proj/build.gradle
          need settings.gradle proj/settings.gradle
          need gradle.properties proj/gradle.properties
          need DisguiseClient.java proj/src/main/java/com/vyn/disguise/DisguiseClient.java
          if [ -n "$(pick fabric.mod.json)" ]; then
            need fabric.mod.json proj/src/main/resources/fabric.mod.json
          else
            need fabric_mod.json proj/src/main/resources/fabric.mod.json
          fi

      - name: Create the names, textures and block looks
        working-directory: proj
        run: |
          python3 - <<'PY'
          import json, os
          base = "src/main/resources/assets/minecraft"

          def w(path, data):
              p = os.path.join(base, path)
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w") as f:
                  json.dump(data, f, indent=2)

          # item look (what you see in inventory / hand)
          items = {
              "blue_glazed_terracotta": "minecraft:item/elytra",
              "slime_ball": "minecraft:block/ancient_debris",
              "heavy_weighted_pressure_plate": "minecraft:block/spawner",
              "sea_lantern": "minecraft:block/netherite_block",
              "wither_rose": "minecraft:item/mace",
              "sticky_piston": "minecraft:block/gilded_blackstone",
          }
          for k, m in items.items():
              w("items/%s.json" % k, {"model": {"type": "minecraft:model", "model": m}})

          # placed block look
          blocks = {
              "heavy_weighted_pressure_plate": "minecraft:block/spawner",
              "sea_lantern": "minecraft:block/netherite_block",
              "sticky_piston": "minecraft:block/gilded_blackstone",
          }
          for k, m in blocks.items():
              w("blockstates/%s.json" % k, {"variants": {"": {"model": m}}})

          # names (pink = same color as the real Elytra / Mace / spawner names)
          names = {
              "block.minecraft.blue_glazed_terracotta": "\u00a7dElytra",
              "item.minecraft.slime_ball": "Ancient Debris",
              "block.minecraft.heavy_weighted_pressure_plate": "\u00a7dSkeleton Spawner",
              "block.minecraft.sea_lantern": "Netherite Block",
              "block.minecraft.wither_rose": "\u00a7dMace",
              "block.minecraft.sticky_piston": "Gilded Blackstone",
          }
          # same names for every common language, so your game language can't override them
          for loc in ["en_us", "en_gb", "en_au", "en_ca", "en_nz", "de_de", "de_at", "de_ch",
                      "sk_sk", "cs_cz", "pl_pl", "hu_hu", "fr_fr", "fr_ca", "es_es", "es_mx",
                      "it_it", "pt_br", "pt_pt", "nl_nl", "ru_ru", "tr_tr", "sl_si", "hr_hr"]:
              w("lang/%s.json" % loc, names)
          print("assets written")
          PY
          find src/main/resources -type f | sort

      - name: Build the mod
        working-directory: proj
        run: gradle build

      - name: Verify the jar has the mod inside
        working-directory: proj
        run: |
          JAR=build/libs/itemdisguise-1.0.0.jar
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q "fabric.mod.json" || { echo "ERROR: fabric.mod.json missing"; exit 1; }
          unzip -l "$JAR" | grep -q "DisguiseClient.class" || { echo "ERROR: mod code missing"; exit 1; }
          unzip -l "$JAR" | grep -q "items/sea_lantern.json" || { echo "ERROR: item textures missing"; exit 1; }
          unzip -l "$JAR" | grep -q "lang/en_us.json" || { echo "ERROR: names missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: itemdisguise-jar
          path: proj/build/libs/itemdisguise-1.0.0.jar
